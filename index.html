<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>English Path — вход</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="brand-panel">
      <div class="logo">EP</div>
      <h1>English Path</h1>
      <p>Английский от A1 до C1: теория, словарь, практика и обязательные тесты.</p>
      <div class="feature-pills">
        <span>Пошаговые уроки</span><span>Словарь</span><span>Тесты 80%+</span><span>Прогресс</span>
      </div>
    </section>

    <section class="login-card">
      <div class="eyebrow">Вход в систему</div>
      <h2>Добро пожаловать</h2>
      <p class="muted">Введите email и пароль, выданные администратором.</p>

      <form id="loginForm">
        <label>Email
          <input id="email" type="email" autocomplete="username" required placeholder="name@example.com">
        </label>
        <label>Пароль
          <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">
        </label>
        <button class="btn primary full" type="submit">Войти</button>
      </form>

      <div id="loginMessage" class="message"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
